[project]
name = "mcp-dnne-ui"
version = "0.1.0"
description = "MCP server for DNNE UI automation using Playwright"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "DNNE Team", email = "dnne@example.com"}
]
dependencies = [
    "mcp>=1.4.0",
    "playwright>=1.48.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-dnne-ui = "src.dnne_ui_mcp_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I"]